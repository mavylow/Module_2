<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simple adaptive header for any website" />
    <link
      rel="stylesheet"
      href="https://necolas.github.io/normalize.css/7.0.0/normalize.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="assets/img/logo.png" />
    <title>Adaptive nav bar markup</title>
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="https://www.redbull.com/eu-en">
          <img src="assets/img/logo.png" height="80px" alt="RedBull_logo"
        /></a>
        <h1>Red Bull</h1>
      </div>
      <nav>
        <ul>
          <li><a href="#">Energy drinks</a></li>
          <li><a href="#">Events</a></li>
          <li><a href="#">Athletes</a></li>
          <li><a href="#">Red Bull TV</a></li>
        </ul>
      </nav>
      <div class="avatar-menu">
        <img src="assets/img/avatar.png" alt="avatar_photo" class="avatar" />
        <div class="menu">
          <input type="checkbox" id="toggle" />
          <svg
            width="40px"
            height="40px"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M4 5C3.44772 5 3 5.44772 3 6C3 6.55228 3.44772 7 4 7H20C20.5523 7 21 6.55228 21 6C21 5.44772 20.5523 5 20 5H4ZM7 12C7 11.4477 7.44772 11 8 11H20C20.5523 11 21 11.4477 21 12C21 12.5523 20.5523 13 20 13H8C7.44772 13 7 12.5523 7 12ZM13 18C13 17.4477 13.4477 17 14 17H20C20.5523 17 21 17.4477 21 18C21 18.5523 20.5523 19 20 19H14C13.4477 19 13 18.5523 13 18Z"
              fill="#000000"
            />
          </svg>

          <ul>
            <li><a href="#">Energy drinks</a></li>
            <li><a href="#">Events</a></li>
            <li><a href="#">Athletes</a></li>
            <li><a href="#">Red Bull TV</a></li>
          </ul>
        </div>
      </div>
    </header>
  </body>
</html>
