<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Card item markup" />
    <link
      rel="stylesheet"
      href="https://necolas.github.io/normalize.css/7.0.0/normalize.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Card item markup</title>
  </head>
  <body>
    <header>
      <h1>Card item markup</h1>
    </header>
    <main>
      <figure class="card">
        <div class="img-container">
          <div class="heart">
            <img
              src="assets/img/heart-like-favorite-svgrepo-com.svg"
              alt="favorites-icon"
            />
          </div>
          <img src="assets/img/shoe.png" alt="shoe" />
        </div>
        <figcaption class="info-container">
          <div class="text-container">
            <h2>Nike Running Shoe</h2>
            <p>
              Crossing hardwood comfort with off-court flair. '80-inspired
              construction, bold details and nothing'-but-net style
            </p>
          </div>
          <div class="price-container">
            <div>
              <p>price</p>
              <h3 class="price">$69.99</h3>
            </div>
            <button>Add to cart</button>
          </div>
        </figcaption>
      </figure>
    </main>
  </body>
</html>
